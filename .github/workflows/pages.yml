# Deploy the static site to GitHub Pages on every push to main.
# (Legacy branch publishing was unreliable; Actions-based Pages deploys deterministically.)
name: Deploy Pages

on:
  push:
    branches: [main]
    # Don't redeploy when the relay or the browser uploads workspace/transcript
    # data — only code changes to the UI matter.
    paths-ignore:
      - 'uploads/**'
      - 'responses/**'
      - 'sessions/**'
      - 'state/**'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
